<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found - NextGenTeens</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="logo.png" />
</head>
<body class="auth-page">
    <!-- Page Loader -->
    <div class="page-loader" id="pageLoader">
        <div class="loader-spinner"></div>
        <div class="loader-text">Loading...</div>
    </div>
    <div class="auth-container">
        <div class="auth-card" style="text-align: center; padding: 3rem 2rem;">
            <div style="font-size: 6rem; margin-bottom: 1rem;">&#128269;</div>
            <h1 style="font-size: 4rem; color: var(--primary); margin-bottom: 0.5rem;">404</h1>
            <h2 style="margin-bottom: 1rem;">Page Not Found</h2>
            <p style="color: var(--text-muted); margin-bottom: 2rem;">
                Oops! The page you're looking for doesn't exist or has been moved.
            </p>
            <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                <a href="index.html" class="btn btn-primary">Go Home</a>
                <a href="login.html" class="btn btn-outline">Sign In</a>
            </div>
        </div>
    </div>
</body>
</html>
